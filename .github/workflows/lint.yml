name: lint
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck install.sh setup-debian13.sh bootstrap.sh
      - name: sintaxis de zsh
        run: sudo apt-get install -y zsh && zsh -n zsh/.zshrc zsh/.zshenv
      - name: stylua (nvim)
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check nvim/.config/nvim
