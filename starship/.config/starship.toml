# starship.toml — configuración mínima y funcional

"$schema" = 'https://starship.rs/config-schema.json'

# Prompt en dos líneas. $all incluye todos los módulos activos de starship
# (los que no aplican al directorio actual simplemente no se muestran).
format = """
[╭─](bold green)$all
[╰─](bold green)$character"""

# El salto de línea lo gestiona el format de arriba
[line_break]
disabled = true

[username]
style_user = "bold cyan"
style_root = "bold red"
show_always = false
format = "[$user]($style) "

[hostname]
ssh_only = true
style = "bold yellow"
ssh_symbol = " "
format = "on [$ssh_symbol$hostname]($style) "

[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "bold purple"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold red"
disabled = false

[character]
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "

