# Alacritty ≥ 0.13 (TOML). Tema Catppuccin Mocha incluido abajo.

[env]
TERM = "xterm-256color"

[terminal.shell]
program = "/usr/bin/zsh"

[window]
padding = { x = 10, y = 8 }
decorations = "full"
dynamic_title = true

[scrolling]
history = 10000

[font]
size = 12.0
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }

[cursor]
style = { shape = "Block", blinking = "Off" }

[selection]
save_to_clipboard = true

# Ctrl+Shift+C/V ya copian y pegan por defecto; se añaden zoom y pantalla completa.
[keyboard]
bindings = [
  { key = "Plus", mods = "Control|Shift", action = "IncreaseFontSize" },
  { key = "Minus", mods = "Control|Shift", action = "DecreaseFontSize" },
  { key = "Key0", mods = "Control|Shift", action = "ResetFontSize" },
  { key = "F11", action = "ToggleFullscreen" },
]

# ── Catppuccin Mocha ─────────────────────────────────────────────────────────
