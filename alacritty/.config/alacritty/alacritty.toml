# Alacritty ≥ 0.13 (TOML). Tema Nord incluido abajo. Recarga solo al guardar.

[env]
TERM = "xterm-256color"

[terminal.shell]
program = "/usr/bin/zsh"

[window]
padding = { x = 14, y = 14 }
decorations = "full"
dynamic_title = true
opacity = 0.92
blur = true

[scrolling]
history = 10000

[font]
size = 13.0
normal = { family = "FiraCode Nerd Font", style = "Regular" }
bold = { family = "FiraCode Nerd Font", style = "Bold" }
italic = { family = "FiraCode Nerd Font", style = "Regular" }

[cursor]
style = { shape = "Block", blinking = "Off" }

[selection]
save_to_clipboard = true

# Ctrl+Shift+C/V ya copian y pegan por defecto; se añaden zoom y pantalla completa.
[keyboard]
bindings = [
  { key = "Plus", mods = "Control|Shift", action = "IncreaseFontSize" },
  { key = "Minus", mods = "Control|Shift", action = "DecreaseFontSize" },
  { key = "Key0", mods = "Control|Shift", action = "ResetFontSize" },
  { key = "F11", action = "ToggleFullscreen" },
]

# ── Nord ─────────────────────────────────────────────────────────────────────
